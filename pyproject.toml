[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgscfnet-fish-freshness"
version = "1.0.0"
description = "Fish freshness classification models and experiments"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = [
    "torch>=2.2,<3", "torchvision>=0.17,<1", "timm>=1.0,<2",
    "numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2",
    "Pillow>=10,<13", "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sgscfnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
